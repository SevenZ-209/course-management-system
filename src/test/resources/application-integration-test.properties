# Dedicated database ONLY for DB integration/concurrency tests.
# It is intentionally NOT course_management_db.
spring.datasource.url=jdbc:mysql://localhost:3306/course_management_test_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=${TEST_DB_USERNAME:${DB_USERNAME:root}}
spring.datasource.password=${TEST_DB_PASSWORD:${DB_PASSWORD:1}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Build a fresh schema for the integration-test Spring context, then drop its tables.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Harmless test-only values. No Cloudinary upload is performed.
cloudinary.cloud-name=test
cloudinary.api-key=test
cloudinary.api-secret=test

jwt.secret=integration-test-jwt-secret-12345678901234567890
jwt.expiration=86400000
