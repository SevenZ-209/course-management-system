<!doctype html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <title>Quản lý câu hỏi</title>
    <th:block th:replace="~{base :: css}"></th:block>
</head>

<body>

<div th:replace="~{base :: header}"></div>

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h3 class="mb-1">Quản lý câu hỏi</h3>

            <span class="text-muted">
                Tổng cộng:
                <strong th:text="${totalRecords}">0</strong>
                câu hỏi
            </span>
        </div>

        <button class="btn btn-primary"
                data-bs-toggle="modal"
                data-bs-target="#addQuestionModal">
            Thêm câu hỏi
        </button>
    </div>

    <div th:if="${successMessage}"
         class="alert alert-success"
         th:text="${successMessage}">
    </div>

    <div th:if="${errorMessage}"
         class="alert alert-danger"
         th:text="${errorMessage}">
    </div>

    <!-- FILTER -->
    <div class="card border-0 shadow-sm mb-4">
        <div class="card-body">

            <form method="get"
                  th:action="@{/admin/questions}">

                <div class="row g-3">

                    <div class="col-md-3">
                        <input type="text"
                               class="form-control"
                               name="kw"
                               th:value="${kw}"
                               placeholder="Tìm nội dung câu hỏi">
                    </div>

                    <div class="col-md-3">
                        <select class="form-select"
                                name="courseId">

                            <option value="">
                                Tất cả khóa học
                            </option>

                            <option th:each="course : ${courses}"
                                    th:value="${course.id}"
                                    th:text="${course.name}"
                                    th:selected="${courseId == course.id.toString()}">
                            </option>

                        </select>
                    </div>

                    <div class="col-md-2">
                        <select class="form-select"
                                name="assignmentId">

                            <option value="">
                                Tất cả bài tập
                            </option>

                            <option th:each="assignment : ${assignments}"
                                    th:value="${assignment.id}"
                                    th:text="${assignment.name}"
                                    th:selected="${assignmentId == assignment.id.toString()}">
                            </option>

                        </select>
                    </div>

                    <div class="col-md-2">
                        <select class="form-select"
                                name="type">

                            <option value="">
                                Tất cả loại
                            </option>

                            <option value="MULTIPLE_CHOICE"
                                    th:selected="${type == 'MULTIPLE_CHOICE'}">
                                Trắc nghiệm
                            </option>

                            <option value="SHORT_ANSWER"
                                    th:selected="${type == 'SHORT_ANSWER'}">
                                Trả lời ngắn
                            </option>

                            <option value="ESSAY"
                                    th:selected="${type == 'ESSAY'}">
                                Tự luận
                            </option>

                        </select>
                    </div>

                    <div class="col-md-2">
                        <button type="submit"
                                class="btn btn-primary">
                            Tìm
                        </button>

                        <a th:href="@{/admin/questions}"
                           class="btn btn-outline-secondary">
                            Làm mới
                        </a>
                    </div>

                </div>

            </form>

        </div>
    </div>

    <!-- TABLE -->
    <div class="card border-0 shadow-sm">
        <div class="card-body p-0">

            <div class="table-responsive">

                <table class="table table-hover align-middle mb-0">

                    <thead class="table-light">
                    <tr>
                        <th>ID</th>
                        <th>Bài tập</th>
                        <th>Thứ tự</th>
                        <th>Nội dung</th>
                        <th>Loại</th>
                        <th>Điểm</th>
                        <th>Chỉnh sửa</th>
                    </tr>
                    </thead>

                    <tbody>

                    <tr th:each="question : ${questions}">

                        <td th:text="${question.id}"></td>

                        <td>
                            <div class="fw-semibold"
                                 th:text="${question.assignment.name}">
                            </div>

                            <small class="text-muted"
                                   th:text="${question.assignment.course.name}">
                            </small>
                        </td>

                        <td>
                            <span class="badge text-bg-primary"
                                  th:text="${'#' + question.orderNumber}">
                            </span>
                        </td>

                        <td style="max-width: 400px;">
                            <div th:text="${question.content}"></div>
                        </td>

                        <td>
                            <span th:if="${question.type.name() == 'MULTIPLE_CHOICE'}"
                                  class="badge text-bg-info">
                                Trắc nghiệm
                            </span>

                            <span th:if="${question.type.name() == 'SHORT_ANSWER'}"
                                  class="badge text-bg-warning">
                                Trả lời ngắn
                            </span>

                            <span th:if="${question.type.name() == 'ESSAY'}"
                                  class="badge text-bg-secondary">
                                Tự luận
                            </span>
                        </td>

                        <td>
                            <strong th:text="${question.score}"></strong>
                        </td>

                        <td>
                            <button type="button"
                                    class="btn btn-sm btn-outline-primary"
                                    data-bs-toggle="modal"
                                    th:data-bs-target="'#editQuestionModal' + ${question.id}">
                                Chỉnh sửa
                            </button>
                        </td>

                    </tr>

                    <tr th:if="${#lists.isEmpty(questions)}">
                        <td colspan="7"
                            class="text-center text-muted py-5">
                            Chưa có câu hỏi.
                        </td>
                    </tr>

                    </tbody>

                </table>

            </div>

        </div>
    </div>

    <!-- PAGINATION -->
    <nav class="mt-4"
         th:if="${totalPages > 1}">

        <ul class="pagination justify-content-center">

            <li class="page-item"
                th:classappend="${currentPage == 1} ? 'disabled'">

                <a class="page-link"
                   th:href="@{/admin/questions(
                        page=${currentPage - 1},
                        kw=${kw},
                        courseId=${courseId},
                        assignmentId=${assignmentId},
                        type=${type}
                   )}">
                    Trước
                </a>
            </li>

            <li class="page-item"
                th:each="pageNumber : ${#numbers.sequence(1, totalPages)}"
                th:classappend="${pageNumber == currentPage} ? 'active'">

                <a class="page-link"
                   th:text="${pageNumber}"
                   th:href="@{/admin/questions(
                        page=${pageNumber},
                        kw=${kw},
                        courseId=${courseId},
                        assignmentId=${assignmentId},
                        type=${type}
                   )}">
                </a>
            </li>

            <li class="page-item"
                th:classappend="${currentPage == totalPages} ? 'disabled'">

                <a class="page-link"
                   th:href="@{/admin/questions(
                        page=${currentPage + 1},
                        kw=${kw},
                        courseId=${courseId},
                        assignmentId=${assignmentId},
                        type=${type}
                   )}">
                    Sau
                </a>
            </li>

        </ul>

    </nav>

</div>


<!-- ADD -->
<div class="modal fade"
     id="addQuestionModal"
     tabindex="-1">

    <div class="modal-dialog modal-lg">
        <div class="modal-content">

            <form method="post"
                  th:action="@{/admin/questions/add}">

                <div class="modal-header">
                    <h5 class="modal-title">
                        Thêm câu hỏi
                    </h5>

                    <button type="button"
                            class="btn-close"
                            data-bs-dismiss="modal">
                    </button>
                </div>

                <div class="modal-body">

                    <div class="mb-3">
                        <label class="form-label">
                            Khóa học
                        </label>

                        <select class="form-select"
                                id="questionCourse"
                                required>

                            <option value="">
                                Chọn khóa học
                            </option>

                            <option th:each="course : ${courses}"
                                    th:value="${course.id}"
                                    th:text="${course.name}">
                            </option>

                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">
                            Bài tập
                        </label>

                        <select class="form-select"
                                id="questionAssignment"
                                name="assignmentId"
                                disabled
                                required>

                            <option value="">
                                Vui lòng chọn khóa học trước
                            </option>

                        </select>

                        <small id="assignmentScoreHelp"
                               class="text-muted">
                        </small>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">
                            Nội dung câu hỏi
                        </label>

                        <textarea class="form-control"
                                  name="content"
                                  rows="4"
                                  required></textarea>
                    </div>

                    <div class="row">

                        <div class="col-md-4 mb-3">
                            <label class="form-label">
                                Loại câu hỏi
                            </label>

                            <select class="form-select"
                                    name="type"
                                    required>

                                <option value="MULTIPLE_CHOICE">
                                    Trắc nghiệm
                                </option>

                                <option value="SHORT_ANSWER">
                                    Trả lời ngắn
                                </option>

                                <option value="ESSAY">
                                    Tự luận
                                </option>

                            </select>
                        </div>

                        <div class="col-md-4 mb-3">
                            <label class="form-label">
                                Điểm
                            </label>

                            <input type="number"
                                   class="form-control"
                                   id="questionScore"
                                   name="score"
                                   min="0.01"
                                   step="0.01"
                                   required>
                        </div>

                        <div class="col-md-4 mb-3">
                            <label class="form-label">
                                Thứ tự
                            </label>

                            <input type="number"
                                   class="form-control"
                                   name="orderNumber"
                                   min="1"
                                   required>
                        </div>

                    </div>

                </div>

                <div class="modal-footer">

                    <button type="button"
                            class="btn btn-outline-secondary"
                            data-bs-dismiss="modal">
                        Hủy
                    </button>

                    <button type="submit"
                            class="btn btn-primary">
                        Thêm câu hỏi
                    </button>

                </div>

            </form>

        </div>
    </div>
</div>


<!-- EDIT -->
<th:block th:each="question : ${questions}">

    <div class="modal fade"
         th:id="'editQuestionModal' + ${question.id}"
         tabindex="-1">

        <div class="modal-dialog modal-lg">
            <div class="modal-content">

                <form method="post"
                      th:action="@{/admin/questions/update}">

                    <input type="hidden"
                           name="questionId"
                           th:value="${question.id}">

                    <div class="modal-header">
                        <h5 class="modal-title">
                            Chỉnh sửa câu hỏi
                        </h5>

                        <button type="button"
                                class="btn-close"
                                data-bs-dismiss="modal">
                        </button>
                    </div>

                    <div class="modal-body">

                        <div class="mb-3">
                            <label class="form-label">
                                Bài tập
                            </label>

                            <input type="text"
                                   class="form-control"
                                   th:value="${question.assignment.course.name
                                        + ' - '
                                        + question.assignment.name}"
                                   disabled>

                            <small class="text-muted">
                                Không thể thay đổi bài tập sau khi tạo câu hỏi.
                            </small>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Nội dung câu hỏi
                            </label>

                            <textarea class="form-control"
                                      name="content"
                                      rows="4"
                                      th:text="${question.content}"
                                      required></textarea>
                        </div>

                        <div class="row">

                            <div class="col-md-4 mb-3">
                                <label class="form-label">
                                    Loại câu hỏi
                                </label>

                                <select class="form-select"
                                        name="type"
                                        required>

                                    <option value="MULTIPLE_CHOICE"
                                            th:selected="${question.type.name() == 'MULTIPLE_CHOICE'}">
                                        Trắc nghiệm
                                    </option>

                                    <option value="SHORT_ANSWER"
                                            th:selected="${question.type.name() == 'SHORT_ANSWER'}">
                                        Trả lời ngắn
                                    </option>

                                    <option value="ESSAY"
                                            th:selected="${question.type.name() == 'ESSAY'}">
                                        Tự luận
                                    </option>

                                </select>
                            </div>

                            <div class="col-md-4 mb-3">
                                <label class="form-label">
                                    Điểm
                                </label>

                                <input type="number"
                                       class="form-control"
                                       name="score"
                                       min="0.01"
                                       step="0.01"
                                       th:max="${question.assignment.maximumScore}"
                                       th:value="${question.score}"
                                       required>
                            </div>

                            <div class="col-md-4 mb-3">
                                <label class="form-label">
                                    Thứ tự
                                </label>

                                <input type="number"
                                       class="form-control"
                                       name="orderNumber"
                                       min="1"
                                       th:value="${question.orderNumber}"
                                       required>
                            </div>

                        </div>

                    </div>

                    <div class="modal-footer">

                        <button type="button"
                                class="btn btn-outline-secondary"
                                data-bs-dismiss="modal">
                            Hủy
                        </button>

                        <button type="submit"
                                class="btn btn-primary">
                            Lưu thay đổi
                        </button>

                    </div>

                </form>

            </div>
        </div>
    </div>

</th:block>


<div th:replace="~{base :: footer}"></div>

<script>
    const courseSelect = document.getElementById("questionCourse");
    const assignmentSelect = document.getElementById("questionAssignment");
    const scoreInput = document.getElementById("questionScore");
    const scoreHelp = document.getElementById("assignmentScoreHelp");

    courseSelect.addEventListener("change", async function () {
        const courseId = this.value;

        assignmentSelect.disabled = true;
        assignmentSelect.innerHTML = "";
        scoreHelp.textContent = "";
        scoreInput.removeAttribute("max");

        if (!courseId) {
            assignmentSelect.innerHTML =
                '<option value="">Vui lòng chọn khóa học trước</option>';
            return;
        }

        assignmentSelect.innerHTML =
            '<option value="">Đang tải bài tập...</option>';

        try {
            const response = await fetch(
                `/admin/questions/assignments?courseId=${courseId}`
            );

            const assignments = await response.json();

            assignmentSelect.innerHTML =
                '<option value="">Chọn bài tập</option>';

            if (assignments.length === 0) {
                assignmentSelect.innerHTML =
                    '<option value="">Khóa học chưa có bài tập</option>';
                return;
            }

            assignments.forEach(assignment => {
                const option = document.createElement("option");

                option.value = assignment.id;
                option.textContent = assignment.name;
                option.dataset.maximumScore = assignment.maximumScore;

                assignmentSelect.appendChild(option);
            });

            assignmentSelect.disabled = false;

        } catch (error) {
            assignmentSelect.innerHTML =
                '<option value="">Không thể tải bài tập</option>';
        }
    });

    assignmentSelect.addEventListener("change", function () {
        const option = this.options[this.selectedIndex];

        if (!option.value) {
            scoreHelp.textContent = "";
            scoreInput.removeAttribute("max");
            return;
        }

        const maximumScore = option.dataset.maximumScore;

        scoreInput.max = maximumScore;
        scoreHelp.textContent =
            `Điểm tối đa của bài: ${maximumScore}`;
    });
</script>

</body>
</html>
