<!doctype html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <title>Quản lý module</title>
    <th:block th:replace="~{base :: css}"></th:block>
</head>

<body>

<div th:replace="~{base :: header}"></div>

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h3 class="mb-1">Quản lý module</h3>
            <span class="text-muted">
                Tổng cộng:
                <strong th:text="${totalRecords}">0</strong>
                module
            </span>
        </div>

        <button class="btn btn-primary"
                data-bs-toggle="modal"
                data-bs-target="#addModuleModal">
            Thêm module
        </button>
    </div>

    <div th:if="${successMessage}"
         class="alert alert-success"
         th:text="${successMessage}">
    </div>

    <div th:if="${errorMessage}"
         class="alert alert-danger"
         th:text="${errorMessage}">
    </div>

    <div class="card border-0 shadow-sm mb-4">
        <div class="card-body">

            <form method="get" th:action="@{/admin/course-modules}">
                <div class="row g-3">

                    <div class="col-md-4">
                        <input type="text"
                               class="form-control"
                               name="kw"
                               th:value="${kw}"
                               placeholder="Tìm tên module">
                    </div>

                    <div class="col-md-3">
                        <select class="form-select" name="courseId">
                            <option value="">Tất cả khóa học</option>

                            <option th:each="course : ${courses}"
                                    th:value="${course.id}"
                                    th:text="${course.name}"
                                    th:selected="${courseId == course.id.toString()}">
                            </option>
                        </select>
                    </div>

                    <div class="col-md-2">
                        <select class="form-select" name="status">
                            <option value="">Tất cả trạng thái</option>
                            <option value="ACTIVE"
                                    th:selected="${status == 'ACTIVE'}">
                                Hoạt động
                            </option>
                            <option value="INACTIVE"
                                    th:selected="${status == 'INACTIVE'}">
                                Ngừng hoạt động
                            </option>
                        </select>
                    </div>

                    <div class="col-md-3">
                        <button type="submit" class="btn btn-primary">
                            Tìm kiếm
                        </button>

                        <a th:href="@{/admin/course-modules}"
                           class="btn btn-outline-secondary">
                            Làm mới
                        </a>
                    </div>

                </div>
            </form>

        </div>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body p-0">

            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">

                    <thead class="table-light">
                    <tr>
                        <th>ID</th>
                        <th>Module</th>
                        <th>Khóa học</th>
                        <th>Thứ tự</th>
                        <th>Trạng thái</th>
                        <th>Chỉnh sửa</th>
                        <th class="cm-col-220">Đổi trạng thái</th>
                    </tr>
                    </thead>

                    <tbody>

                    <tr th:each="module : ${modules}">

                        <td th:text="${module.id}"></td>

                        <td class="fw-semibold"
                            th:text="${module.name}">
                        </td>

                        <td>
                            <span class="badge text-bg-light border"
                                  th:text="${module.course.name}">
                            </span>
                        </td>

                        <td>
                            <span class="badge text-bg-primary"
                                  th:text="${module.orderNumber}">
                            </span>
                        </td>

                        <td>
                            <span th:if="${module.status.name() == 'ACTIVE'}"
                                  class="badge text-bg-success">
                                Hoạt động
                            </span>

                            <span th:if="${module.status.name() == 'INACTIVE'}"
                                  class="badge text-bg-secondary">
                                Ngừng hoạt động
                            </span>
                        </td>

                        <td>
                            <button type="button"
                                    class="btn btn-sm btn-outline-primary"
                                    data-bs-toggle="modal"
                                    th:data-bs-target="'#editModuleModal' + ${module.id}">
                                Chỉnh sửa
                            </button>
                        </td>

                        <td>
                            <form method="post"
                                  th:action="@{/admin/course-modules/update-status}"
                                  class="d-flex gap-2">

                                <input type="hidden"
                                       name="moduleId"
                                       th:value="${module.id}">

                                <select class="form-select form-select-sm"
                                        name="status">

                                    <option value="ACTIVE"
                                            th:selected="${module.status.name() == 'ACTIVE'}">
                                        Hoạt động
                                    </option>

                                    <option value="INACTIVE"
                                            th:selected="${module.status.name() == 'INACTIVE'}">
                                        Ngừng hoạt động
                                    </option>

                                </select>

                                <button type="submit"
                                        class="btn btn-sm btn-outline-dark">
                                    Lưu
                                </button>

                            </form>
                        </td>

                    </tr>

                    <tr th:if="${#lists.isEmpty(modules)}">
                        <td colspan="7"
                            class="text-center text-muted py-5">
                            Không tìm thấy module.
                        </td>
                    </tr>

                    </tbody>

                </table>
            </div>

        </div>
    </div>

    <nav class="mt-4" th:if="${totalPages > 1}">
        <ul class="pagination justify-content-center">

            <li class="page-item"
                th:classappend="${currentPage == 1} ? 'disabled'">

                <a class="page-link"
                   th:href="@{/admin/course-modules(
                        page=${currentPage - 1},
                        kw=${kw},
                        courseId=${courseId},
                        status=${status}
                   )}">
                    Trước
                </a>
            </li>

            <li class="page-item"
                th:each="pageNumber : ${#numbers.sequence(1, totalPages)}"
                th:classappend="${pageNumber == currentPage} ? 'active'">

                <a class="page-link"
                   th:text="${pageNumber}"
                   th:href="@{/admin/course-modules(
                        page=${pageNumber},
                        kw=${kw},
                        courseId=${courseId},
                        status=${status}
                   )}">
                </a>
            </li>

            <li class="page-item"
                th:classappend="${currentPage == totalPages} ? 'disabled'">

                <a class="page-link"
                   th:href="@{/admin/course-modules(
                        page=${currentPage + 1},
                        kw=${kw},
                        courseId=${courseId},
                        status=${status}
                   )}">
                    Sau
                </a>
            </li>

        </ul>
    </nav>

</div>

<div class="modal fade" id="addModuleModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">

            <form method="post"
                  th:action="@{/admin/course-modules/add}">

                <div class="modal-header">
                    <h5 class="modal-title">Thêm module</h5>

                    <button type="button"
                            class="btn-close"
                            data-bs-dismiss="modal">
                    </button>
                </div>

                <div class="modal-body">

                    <div class="mb-3">
                        <label class="form-label">Tên module</label>

                        <input type="text"
                               class="form-control"
                               name="name"
                               required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Khóa học</label>

                        <select class="form-select"
                                name="courseId"
                                required>

                            <option value="">Chọn khóa học</option>

                            <option th:each="course : ${courses}"
                                    th:value="${course.id}"
                                    th:text="${course.name}">
                            </option>

                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Thứ tự</label>

                        <input type="number"
                               class="form-control"
                               name="orderNumber"
                               min="1"
                               value="1"
                               required>
                    </div>

                </div>

                <div class="modal-footer">

                    <button type="button"
                            class="btn btn-outline-secondary"
                            data-bs-dismiss="modal">
                        Hủy
                    </button>

                    <button type="submit"
                            class="btn btn-primary">
                        Thêm
                    </button>

                </div>

            </form>

        </div>
    </div>
</div>

<th:block th:each="module : ${modules}">

    <div class="modal fade"
         th:id="'editModuleModal' + ${module.id}"
         tabindex="-1">

        <div class="modal-dialog">
            <div class="modal-content">

                <form method="post"
                      th:action="@{/admin/course-modules/update}">

                    <input type="hidden"
                           name="moduleId"
                           th:value="${module.id}">

                    <div class="modal-header">
                        <h5 class="modal-title">Chỉnh sửa module</h5>

                        <button type="button"
                                class="btn-close"
                                data-bs-dismiss="modal">
                        </button>
                    </div>

                    <div class="modal-body">

                        <div class="mb-3">
                            <label class="form-label">Tên module</label>

                            <input type="text"
                                   class="form-control"
                                   name="name"
                                   th:value="${module.name}"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Khóa học</label>

                            <select class="form-select"
                                    name="courseId"
                                    required>

                                <option th:each="course : ${courses}"
                                        th:value="${course.id}"
                                        th:text="${course.name}"
                                        th:selected="${course.id == module.course.id}">
                                </option>

                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Thứ tự</label>

                            <input type="number"
                                   class="form-control"
                                   name="orderNumber"
                                   min="1"
                                   th:value="${module.orderNumber}"
                                   required>
                        </div>

                    </div>

                    <div class="modal-footer">

                        <button type="button"
                                class="btn btn-outline-secondary"
                                data-bs-dismiss="modal">
                            Hủy
                        </button>

                        <button type="submit"
                                class="btn btn-primary">
                            Lưu thay đổi
                        </button>

                    </div>

                </form>

            </div>
        </div>
    </div>

</th:block>

<div th:replace="~{base :: footer}"></div>

</body>
</html>
