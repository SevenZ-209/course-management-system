<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><title>Quản lý thanh toán</title><th:block th:replace="~{base :: css}"></th:block></head>
<body>
<div th:replace="~{base :: header}"></div>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4"><div><h3 class="mb-1">Quản lý thanh toán</h3><span class="text-muted">Tổng cộng: <strong th:text="${totalRecords}">0</strong> giao dịch</span></div></div>
    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div><div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
    <div class="card border-0 shadow-sm mb-4"><div class="card-body"><form method="get" th:action="@{/admin/payment-transactions}"><div class="row g-3">
        <div class="col-md-3"><input type="text" class="form-control" name="kw" th:value="${kw}" placeholder="Mã GD, tên, username, email"></div>
        <div class="col-md-3"><select class="form-select" name="courseId"><option value="">Tất cả khóa học</option><option th:each="course : ${courses}" th:value="${course.id}" th:text="${course.name}" th:selected="${courseId == course.id.toString()}"></option></select></div>
        <div class="col-md-2"><select class="form-select" name="status"><option value="">Tất cả trạng thái</option><option value="PENDING" th:selected="${status == 'PENDING'}">Chờ xử lý</option><option value="SUCCESS" th:selected="${status == 'SUCCESS'}">Thành công</option><option value="FAILED" th:selected="${status == 'FAILED'}">Thất bại</option></select></div>
        <div class="col-md-2"><input type="date" class="form-control" name="date" th:value="${date}"></div>
        <div class="col-md-2"><button type="submit" class="btn btn-primary">Tìm</button> <a th:href="@{/admin/payment-transactions}" class="btn btn-outline-secondary">Làm mới</a></div>
    </div></form></div></div>

    <div class="card border-0 shadow-sm"><div class="card-body p-0"><div class="table-responsive"><table class="table table-hover align-middle mb-0">
        <thead class="table-light"><tr><th>ID</th><th>Học viên</th><th>Khóa học / Lớp</th><th>Số tiền</th><th>Phương thức</th><th>Mã giao dịch</th><th>Trạng thái</th><th>Ngày tạo</th><th>Xử lý</th></tr></thead>
        <tbody>
        <tr th:each="transaction : ${transactions}">
            <td th:text="${transaction.id}"></td>
            <td><div class="fw-semibold" th:text="${transaction.enrollment.student.fullName}"></div><small class="text-muted">@<span th:text="${transaction.enrollment.student.username}"></span> · ID <span th:text="${transaction.enrollment.student.id}"></span></small></td>
            <td><div th:text="${transaction.enrollment.courseClass.course.name}"></div><small class="text-muted" th:text="${transaction.enrollment.courseClass.name}"></small></td>
            <td><strong th:text="${#numbers.formatDecimal(transaction.amount,0,'POINT',0,'COMMA')}"></strong> VNĐ</td>
            <td th:text="${transaction.paymentMethod}"></td><td class="font-monospace" th:text="${transaction.transactionCode}"></td>
            <td><span th:if="${transaction.status.name() == 'PENDING'}" class="badge text-bg-warning">Chờ xử lý</span><span th:if="${transaction.status.name() == 'SUCCESS'}" class="badge text-bg-success">Thành công</span><span th:if="${transaction.status.name() == 'FAILED'}" class="badge text-bg-danger">Thất bại</span><span th:if="${transaction.status.name() == 'REFUNDED'}" class="badge text-bg-secondary">Hoàn tiền</span></td>
            <td><span th:if="${transaction.createdAt != null}" th:text="${#temporals.format(transaction.createdAt,'dd/MM/yyyy HH:mm')}"></span></td>
            <td>
                <div class="d-flex gap-2" th:if="${transaction.status.name() == 'PENDING'}">
                    <form method="post" th:action="@{/admin/payment-transactions/update-status}" onsubmit="return confirm('Xác nhận giao dịch thành công?');"><input type="hidden" name="transactionId" th:value="${transaction.id}"><input type="hidden" name="status" value="SUCCESS"><button class="btn btn-sm btn-success" type="submit">Thành công</button></form>
                    <form method="post" th:action="@{/admin/payment-transactions/update-status}" onsubmit="return confirm('Đánh dấu giao dịch thất bại?');"><input type="hidden" name="transactionId" th:value="${transaction.id}"><input type="hidden" name="status" value="FAILED"><button class="btn btn-sm btn-outline-danger" type="submit">Thất bại</button></form>
                </div>
                <span th:unless="${transaction.status.name() == 'PENDING'}" class="text-muted">Đã xử lý</span>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(transactions)}"><td colspan="9" class="text-center text-muted py-5">Chưa có giao dịch thanh toán.</td></tr>
        </tbody>
    </table></div></div></div>
    <nav class="mt-4" th:if="${totalPages > 1}"><ul class="pagination justify-content-center"><li class="page-item" th:classappend="${currentPage == 1} ? 'disabled'"><a class="page-link" th:href="@{/admin/payment-transactions(page=${currentPage - 1},kw=${kw},courseId=${courseId},status=${status},date=${date})}">Trước</a></li><li class="page-item" th:each="pageNumber : ${#numbers.sequence(1,totalPages)}" th:classappend="${pageNumber == currentPage} ? 'active'"><a class="page-link" th:text="${pageNumber}" th:href="@{/admin/payment-transactions(page=${pageNumber},kw=${kw},courseId=${courseId},status=${status},date=${date})}"></a></li><li class="page-item" th:classappend="${currentPage == totalPages} ? 'disabled'"><a class="page-link" th:href="@{/admin/payment-transactions(page=${currentPage + 1},kw=${kw},courseId=${courseId},status=${status},date=${date})}">Sau</a></li></ul></nav>
</div>
<div th:replace="~{base :: footer}"></div>
</body></html>
