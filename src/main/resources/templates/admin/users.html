<!doctype html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
  <title>Quản lý người dùng</title>
  <th:block th:replace="~{base :: css}"></th:block>
</head>

<body>

<div th:replace="~{base :: header}"></div>

<div class="container mt-4">

  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h3 class="mb-1">Quản lý người dùng</h3>
      <span class="text-muted">
                Tổng cộng:
                <strong th:text="${totalRecords}">0</strong>
                người dùng
            </span>
    </div>
  </div>

  <div th:if="${successMessage}"
       class="alert alert-success"
       th:text="${successMessage}">
  </div>

  <div th:if="${errorMessage}"
       class="alert alert-danger"
       th:text="${errorMessage}">
  </div>

  <div class="card border-0 shadow-sm mb-4">
    <div class="card-body">

      <form method="get" th:action="@{/admin/users}">
        <div class="row g-3">

          <div class="col-md-5">
            <input type="text"
                   class="form-control"
                   name="kw"
                   th:value="${kw}"
                   placeholder="Tìm username, họ tên hoặc email">
          </div>

          <div class="col-md-2">
            <select class="form-select" name="role">
              <option value="">Tất cả quyền</option>
              <option value="STUDENT" th:selected="${role == 'STUDENT'}">Học viên</option>
              <option value="TEACHER" th:selected="${role == 'TEACHER'}">Giáo viên</option>
              <option value="MANAGER" th:selected="${role == 'MANAGER'}">Quản lý</option>
              <option value="PARENT" th:selected="${role == 'PARENT'}">Phụ huynh</option>
              <option value="ADMIN" th:selected="${role == 'ADMIN'}">Admin</option>
            </select>
          </div>

          <div class="col-md-2">
            <select class="form-select" name="status">
              <option value="">Tất cả trạng thái</option>
              <option value="ACTIVE" th:selected="${status == 'ACTIVE'}">Hoạt động</option>
              <option value="INACTIVE" th:selected="${status == 'INACTIVE'}">Ngừng hoạt động</option>
              <option value="LOCKED" th:selected="${status == 'LOCKED'}">Đã khóa</option>
            </select>
          </div>

          <div class="col-md-3">
            <button type="submit" class="btn btn-primary">
              Tìm kiếm
            </button>

            <a th:href="@{/admin/users}"
               class="btn btn-outline-secondary">
              Làm mới
            </a>
          </div>

        </div>
      </form>

    </div>
  </div>

  <div class="card border-0 shadow-sm">
    <div class="card-body p-0">

      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">

          <thead class="table-light">
          <tr>
            <th>ID</th>
            <th>Người dùng</th>
            <th>Email</th>
            <th>Quyền</th>
            <th>Trạng thái</th>
            <th class="cm-col-210">Đổi quyền</th>
            <th class="cm-col-220">Đổi trạng thái</th>
          </tr>
          </thead>

          <tbody>

          <tr th:each="user : ${users}">

            <td th:text="${user.id}"></td>

            <td>
              <div class="d-flex align-items-center gap-3">

                <img th:if="${user.avatar != null and !user.avatar.isBlank()}"
                     th:src="${user.avatar}"
                     width="42"
                     height="42"
                     class="rounded-circle object-fit-cover"
                     alt="avatar">

                <div th:unless="${user.avatar != null and !user.avatar.isBlank()}"
                     class="rounded-circle bg-secondary text-white d-flex align-items-center justify-content-center cm-avatar-42">
                  <span th:text="${#strings.substring(user.username, 0, 1).toUpperCase()}"></span>
                </div>

                <div>
                  <div class="fw-semibold"
                       th:text="${user.fullName}">
                  </div>

                  <small class="text-muted">
                    @<span th:text="${user.username}"></span>
                  </small>
                </div>

              </div>
            </td>

            <td th:text="${user.email}"></td>

            <td>
                            <span th:if="${user.role.name() == 'ADMIN'}"
                                  class="badge text-bg-danger">
                                ADMIN
                            </span>

              <span th:if="${user.role.name() == 'MANAGER'}"
                    class="badge text-bg-warning">
                                QUẢN LÝ
                            </span>

              <span th:if="${user.role.name() == 'TEACHER'}"
                    class="badge text-bg-primary">
                                GIÁO VIÊN
                            </span>

              <span th:if="${user.role.name() == 'STUDENT'}"
                    class="badge text-bg-success">
                                HỌC VIÊN
                            </span>

              <span th:if="${user.role.name() == 'PARENT'}"
                    class="badge text-bg-secondary">
                                PHỤ HUYNH
                            </span>
            </td>

            <td>
                            <span th:if="${user.status.name() == 'ACTIVE'}"
                                  class="badge text-bg-success">
                                Hoạt động
                            </span>

              <span th:if="${user.status.name() == 'INACTIVE'}"
                    class="badge text-bg-secondary">
                                Ngừng hoạt động
                            </span>

              <span th:if="${user.status.name() == 'LOCKED'}"
                    class="badge text-bg-danger">
                                Đã khóa
                            </span>
            </td>

            <td>
              <form method="post"
                    th:action="@{/admin/users/update-role}"
                    class="d-flex gap-2">

                <input type="hidden"
                       name="userId"
                       th:value="${user.id}">

                <select class="form-select form-select-sm"
                        name="role">

                  <option value="STUDENT"
                          th:selected="${user.role.name() == 'STUDENT'}">
                    Học viên
                  </option>

                  <option value="TEACHER"
                          th:selected="${user.role.name() == 'TEACHER'}">
                    Giáo viên
                  </option>

                  <option value="MANAGER"
                          th:selected="${user.role.name() == 'MANAGER'}">
                    Quản lý
                  </option>

                  <option value="PARENT"
                          th:selected="${user.role.name() == 'PARENT'}">
                    Phụ huynh
                  </option>

                  <option value="ADMIN"
                          th:selected="${user.role.name() == 'ADMIN'}">
                    Admin
                  </option>

                </select>

                <button type="submit"
                        class="btn btn-sm btn-outline-primary">
                  Lưu
                </button>

              </form>
            </td>

            <td>
              <form method="post"
                    th:action="@{/admin/users/update-status}"
                    class="d-flex gap-2">

                <input type="hidden"
                       name="userId"
                       th:value="${user.id}">

                <select class="form-select form-select-sm"
                        name="status">

                  <option value="ACTIVE"
                          th:selected="${user.status.name() == 'ACTIVE'}">
                    Hoạt động
                  </option>

                  <option value="INACTIVE"
                          th:selected="${user.status.name() == 'INACTIVE'}">
                    Ngừng hoạt động
                  </option>

                  <option value="LOCKED"
                          th:selected="${user.status.name() == 'LOCKED'}">
                    Khóa
                  </option>

                </select>

                <button type="submit"
                        class="btn btn-sm btn-outline-dark">
                  Lưu
                </button>

              </form>
            </td>

          </tr>

          <tr th:if="${#lists.isEmpty(users)}">
            <td colspan="7"
                class="text-center text-muted py-5">
              Không tìm thấy người dùng.
            </td>
          </tr>

          </tbody>

        </table>
      </div>

    </div>
  </div>

  <nav class="mt-4"
       th:if="${totalPages > 1}">

    <ul class="pagination justify-content-center">

      <li class="page-item"
          th:classappend="${currentPage == 1} ? 'disabled'">

        <a class="page-link"
           th:href="@{/admin/users(
                        page=${currentPage - 1},
                        kw=${kw},
                        role=${role},
                        status=${status}
                   )}">
          Trước
        </a>
      </li>

      <li class="page-item"
          th:each="pageNumber : ${#numbers.sequence(1, totalPages)}"
          th:classappend="${pageNumber == currentPage} ? 'active'">

        <a class="page-link"
           th:text="${pageNumber}"
           th:href="@{/admin/users(
                        page=${pageNumber},
                        kw=${kw},
                        role=${role},
                        status=${status}
                   )}">
        </a>
      </li>

      <li class="page-item"
          th:classappend="${currentPage == totalPages} ? 'disabled'">

        <a class="page-link"
           th:href="@{/admin/users(
                        page=${currentPage + 1},
                        kw=${kw},
                        role=${role},
                        status=${status}
                   )}">
          Sau
        </a>
      </li>

    </ul>
  </nav>

</div>

<div th:replace="~{base :: footer}"></div>

</body>
</html>
