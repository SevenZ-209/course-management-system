<!doctype html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <title>Chi tiết lộ trình</title>
    <th:block th:replace="~{base :: css}"></th:block>
</head>

<body>

<div th:replace="~{base :: header}"></div>

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h3 class="mb-1">Chi tiết lộ trình</h3>

            <span class="text-muted">
                Tổng cộng:
                <strong th:text="${totalRecords}">0</strong>
                bài
            </span>
        </div>

        <button class="btn btn-primary"
                data-bs-toggle="modal"
                data-bs-target="#addDetailModal">
            Thêm bài vào lộ trình
        </button>
    </div>

    <div th:if="${successMessage}"
         class="alert alert-success"
         th:text="${successMessage}">
    </div>

    <div th:if="${errorMessage}"
         class="alert alert-danger"
         th:text="${errorMessage}">
    </div>

    <div class="card border-0 shadow-sm mb-4">
        <div class="card-body">

            <form method="get"
                  th:action="@{/admin/learning-path-details}">

                <div class="row g-3">

                    <div class="col-md-3">
                        <input type="text"
                               class="form-control"
                               name="kw"
                               th:value="${kw}"
                               placeholder="Tìm lộ trình hoặc bài tập">
                    </div>

                    <div class="col-md-3">
                        <select class="form-select" id="pathDetailFilterCourse"
                                name="courseId">

                            <option value="">
                                Tất cả khóa học
                            </option>

                            <option th:each="course : ${courses}"
                                    th:value="${course.id}"
                                    th:text="${course.name}"
                                    th:selected="${courseId == course.id.toString()}">
                            </option>

                        </select>
                    </div>

                    <div class="col-md-3">
                        <select class="form-select" name="learningPathId" data-dependent-select
                                data-parent-id="pathDetailFilterCourse" data-endpoint="/admin/learning-path-details/paths"
                                data-param="courseId" data-empty-label="Tất cả lộ trình"
                                data-waiting-label="Chọn khóa học trước" th:attr="data-selected=${learningPathId}">
                            <option value="">Chọn khóa học trước</option>
                        </select>
                    </div>

                    <div class="col-md-3">
                        <button type="submit"
                                class="btn btn-primary">
                            Tìm
                        </button>

                        <a th:href="@{/admin/learning-path-details}"
                           class="btn btn-outline-secondary">
                            Làm mới
                        </a>
                    </div>

                </div>

            </form>

        </div>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body p-0">

            <div class="table-responsive">

                <table class="table table-hover align-middle mb-0">

                    <thead class="table-light">
                    <tr>
                        <th>Khóa học</th>
                        <th>Lộ trình</th>
                        <th>Bài tập</th>
                        <th>Thứ tự</th>
                        <th>Điểm đạt</th>
                        <th>Lần làm tối đa</th>
                        <th>Thao tác</th>
                    </tr>
                    </thead>

                    <tbody>

                    <tr th:each="detail : ${details}">

                        <td>
                            <span class="badge text-bg-light border"
                                  th:text="${detail.learningPath.course.name}">
                            </span>
                        </td>

                        <td>
                            <span class="fw-semibold"
                                  th:text="${detail.learningPath.name}">
                            </span>
                        </td>

                        <td th:text="${detail.assignment.name}"></td>

                        <td th:text="${detail.orderNumber}"></td>

                        <td>
                            <span th:text="${detail.minimumScore}"></span>
                            <span class="text-muted">điểm</span>
                        </td>

                        <td th:text="${detail.maxAttempts}"></td>

                        <td>
                            <div class="d-flex gap-2">

                                <button type="button"
                                        class="btn btn-sm btn-outline-primary"
                                        data-bs-toggle="modal"
                                        th:data-bs-target="'#editDetailModal' + ${detail.id}">
                                    Chỉnh sửa
                                </button>

                            </div>
                        </td>

                    </tr>

                    <tr th:if="${#lists.isEmpty(details)}">
                        <td colspan="7"
                            class="text-center text-muted py-5">
                            Chưa có chi tiết lộ trình.
                        </td>
                    </tr>

                    </tbody>

                </table>

            </div>
        </div>
    </div>

    <nav class="mt-4"
         th:if="${totalPages > 1}">

        <ul class="pagination justify-content-center">

            <li class="page-item"
                th:classappend="${currentPage == 1} ? 'disabled'">

                <a class="page-link"
                   th:href="@{/admin/learning-path-details(
                        page=${currentPage - 1},
                        kw=${kw},
                        courseId=${courseId},
                        learningPathId=${learningPathId}
                   )}">
                    Trước
                </a>
            </li>

            <li class="page-item"
                th:each="pageNumber : ${#numbers.sequence(1, totalPages)}"
                th:classappend="${pageNumber == currentPage} ? 'active'">

                <a class="page-link"
                   th:text="${pageNumber}"
                   th:href="@{/admin/learning-path-details(
                        page=${pageNumber},
                        kw=${kw},
                        courseId=${courseId},
                        learningPathId=${learningPathId}
                   )}">
                </a>

            </li>

            <li class="page-item"
                th:classappend="${currentPage == totalPages} ? 'disabled'">

                <a class="page-link"
                   th:href="@{/admin/learning-path-details(
                        page=${currentPage + 1},
                        kw=${kw},
                        courseId=${courseId},
                        learningPathId=${learningPathId}
                   )}">
                    Sau
                </a>
            </li>

        </ul>
    </nav>

</div>

<div class="modal fade"
     id="addDetailModal"
     tabindex="-1">

    <div class="modal-dialog">
        <div class="modal-content">

            <form method="post"
                  th:action="@{/admin/learning-path-details/add}">

                <div class="modal-header">
                    <h5 class="modal-title">
                        Thêm bài vào lộ trình
                    </h5>

                    <button type="button"
                            class="btn-close"
                            data-bs-dismiss="modal">
                    </button>
                </div>

                <div class="modal-body">

                    <div class="mb-3">
                        <label class="form-label">Khóa học</label>
                        <select class="form-select" id="addPathDetailCourse" required>
                            <option value="">Chọn khóa học</option>
                            <option th:each="course : ${courses}" th:value="${course.id}" th:text="${course.name}"></option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Lộ trình</label>
                        <select class="form-select" id="addPathDetailPath" name="learningPathId" required data-dependent-select
                                data-parent-id="addPathDetailCourse" data-endpoint="/admin/learning-path-details/paths"
                                data-param="courseId" data-empty-label="Chọn lộ trình" data-waiting-label="Chọn khóa học trước">
                            <option value="">Chọn khóa học trước</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Bài tập</label>
                        <select class="form-select" name="assignmentId" required data-dependent-select
                                data-parent-id="addPathDetailPath" data-endpoint="/admin/learning-path-details/assignments"
                                data-param="learningPathId" data-empty-label="Chọn bài tập" data-waiting-label="Chọn lộ trình trước">
                            <option value="">Chọn lộ trình trước</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">
                            Thứ tự
                        </label>

                        <input type="number"
                               class="form-control"
                               name="orderNumber"
                               min="1"
                               required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">
                            Điểm đạt
                        </label>

                        <input type="number"
                               class="form-control"
                               name="minimumScore"
                               min="0"
                               step="0.01"
                               required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">
                            Số lần làm tối đa
                        </label>

                        <input type="number"
                               class="form-control"
                               name="maxAttempts"
                               min="1"
                               value="1"
                               required>
                    </div>

                </div>

                <div class="modal-footer">

                    <button type="button"
                            class="btn btn-outline-secondary"
                            data-bs-dismiss="modal">
                        Hủy
                    </button>

                    <button type="submit"
                            class="btn btn-primary">
                        Thêm
                    </button>

                </div>

            </form>
        </div>
    </div>
</div>

<th:block th:each="detail : ${details}">

    <div class="modal fade"
         th:id="'editDetailModal' + ${detail.id}"
         tabindex="-1">

        <div class="modal-dialog">
            <div class="modal-content">

                <form method="post"
                      th:action="@{/admin/learning-path-details/update}">

                    <input type="hidden"
                           name="detailId"
                           th:value="${detail.id}">

                    <div class="modal-header">

                        <h5 class="modal-title">
                            Chỉnh sửa chi tiết lộ trình
                        </h5>

                        <button type="button"
                                class="btn-close"
                                data-bs-dismiss="modal">
                        </button>

                    </div>

                    <div class="modal-body">

                        <div class="mb-3">
                            <label class="form-label">
                                Lộ trình
                            </label>

                            <input type="text"
                                   class="form-control"
                                   th:value="${detail.learningPath.name}"
                                   disabled>
                        </div>

                        <input type="hidden" th:id="'editPathDetailPath' + ${detail.id}" th:value="${detail.learningPath.id}">

                        <div class="mb-3">
                            <label class="form-label">Bài tập</label>
                            <select class="form-select" name="assignmentId" required data-dependent-select
                                    data-endpoint="/admin/learning-path-details/assignments" data-param="learningPathId"
                                    data-empty-label="Chọn bài tập" data-waiting-label="Đang tải..."
                                    th:attr="data-parent-id=${'editPathDetailPath' + detail.id},data-selected=${detail.assignment.id}">
                                <option value="">Đang tải...</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Thứ tự
                            </label>

                            <input type="number"
                                   class="form-control"
                                   name="orderNumber"
                                   min="1"
                                   th:value="${detail.orderNumber}"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Điểm đạt
                            </label>

                            <input type="number"
                                   class="form-control"
                                   name="minimumScore"
                                   min="0"
                                   step="0.01"
                                   th:value="${detail.minimumScore}"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Số lần làm tối đa
                            </label>

                            <input type="number"
                                   class="form-control"
                                   name="maxAttempts"
                                   min="1"
                                   th:value="${detail.maxAttempts}"
                                   required>
                        </div>

                    </div>

                    <div class="modal-footer">

                        <button type="button"
                                class="btn btn-outline-secondary"
                                data-bs-dismiss="modal">
                            Hủy
                        </button>

                        <button type="submit"
                                class="btn btn-primary">
                            Lưu
                        </button>

                    </div>

                </form>
            </div>
        </div>
    </div>

</th:block>

<div th:replace="~{base :: footer}"></div>
<script th:src="@{/js/admin-selection.js}"></script>

</body>
</html>
