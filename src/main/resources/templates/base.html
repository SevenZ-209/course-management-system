<!doctype html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <title>Course Management</title>

    <th:block th:fragment="css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
              rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </th:block>
</head>

<body>

<header th:fragment="header">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">

            <a class="navbar-brand fw-bold" th:href="@{/}">
                Course Admin
            </a>

            <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarAdmin">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse"
                 id="navbarAdmin"
                 sec:authorize="isAuthenticated()">

                <ul class="navbar-nav me-auto">

                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/admin/users}">
                            Người dùng
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/admin/categories}">
                            Danh mục
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/admin/courses}">
                            Khóa học
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/admin/course-modules}">
                            Module
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/admin/lessons}">
                            Bài học
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/admin/classes}">
                            Lớp học
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/admin/online-sessions}">
                            Buổi học
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/admin/attendances}">
                            Điểm danh
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/admin/enrollments}">
                            Đăng ký lớp
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/admin/payment-transactions}">
                            Thanh toán
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/admin/parent-links}">
                            Liên kết PH
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/admin/learning-paths}">
                            Lộ trình học
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/admin/assignments}">
                            Bài tập
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/admin/student-learning-paths}">
                            Tiến độ học
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/admin/assigned-assignments}">
                            Bài đã giao
                        </a>
                    </li>

                </ul>

                <form method="post" th:action="@{/logout}">
                    <button type="submit" class="btn btn-outline-light btn-sm">
                        Đăng xuất
                    </button>
                </form>

            </div>

        </div>
    </nav>
</header>

<footer th:fragment="footer">
    <div class="container mt-5">
        <div class="border-top py-3 text-center text-muted">
            Course Management System © 2026
        </div>
    </div>
</footer>

</body>
</html>
