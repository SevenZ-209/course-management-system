<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Đăng nhập quản trị</title>
    <th:block th:replace="~{base :: css}"></th:block>
</head>

<body class="cm-auth-page">

<div th:replace="~{base :: header}"></div>

<section class="cm-login-wrap">
    <div class="card cm-login-card">
        <div class="card-body">
            <div class="cm-login-eyebrow">CourseHub Admin</div>
            <h3 class="cm-login-title">Đăng nhập quản trị</h3>
            <p class="cm-login-note">Truy cập khu vực quản trị hệ thống CourseHub.</p>

            <div th:if="${param.error}" class="alert alert-danger">
                Tên đăng nhập hoặc mật khẩu không chính xác.
            </div>

            <div th:if="${param.logout}" class="alert alert-success">
                Đăng xuất thành công.
            </div>

            <form method="post" th:action="@{/login}">
                <div class="form-floating mb-3">
                    <input type="text"
                           class="form-control"
                           id="username"
                           name="username"
                           placeholder="Tên đăng nhập"
                           required
                           autofocus>
                    <label for="username">Tên đăng nhập</label>
                </div>

                <div class="form-floating mb-3">
                    <input type="password"
                           class="form-control"
                           id="password"
                           name="password"
                           placeholder="Mật khẩu"
                           required>
                    <label for="password">Mật khẩu</label>
                </div>

                <button type="submit" class="btn btn-primary w-100 cm-login-submit">
                    Đăng nhập
                </button>
            </form>
        </div>
    </div>
</section>

<div th:replace="~{base :: footer}"></div>

</body>
</html>
